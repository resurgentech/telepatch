[package]
name = "telepatch"
description = "Trace imperative Rust roles into a per-host graph and stream it into persistent shells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
telepatch-macros = { workspace = true }
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
trybuild = "1"
