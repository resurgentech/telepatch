[package]
name = "telepatch"
description = "Trace imperative Rust roles into a per-host graph and stream it into persistent shells"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
askama = "0.16.1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0.154"
similar = "2.7"
telepatch-macros = { workspace = true }
toml = "1"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"
trybuild = "1"
