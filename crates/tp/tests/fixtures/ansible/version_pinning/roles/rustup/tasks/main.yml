---
- name: Get cargo version
  shell: cargo --version | cut -d " " -f 2
  register: cargo_version_result
  changed_when: false

- name: Check if cargo needs update
  set_fact:
    cargo_needs_update: "{{ cargo_version_result.stdout != cargo_version }}"

- name: Update cargo
  shell: rustup update
  when: cargo_needs_update
