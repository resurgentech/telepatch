<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1000" width="2200" height="1000">
  <title>telepatch: a man controlling a computer by thought</title>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="screenglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#36e836" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#36e836" stop-opacity="0"/>
    </radialGradient>

    <!-- head and bust, profile facing right; hair is part of the silhouette -->
    <path id="bust" d="
      M280 1000
      L330 850
      C370 790 430 770 480 760
      L470 680
      C420 640 390 560 388 460
      C388 350 420 230 500 170
      C540 134 620 116 690 140
      C732 156 752 200 742 258
      C748 296 752 318 752 332
      C746 348 738 360 740 372
      C748 396 756 420 776 446
      C796 468 826 476 828 486
      C826 500 800 506 790 508
      C786 522 788 530 796 538
      C816 548 814 566 794 572
      C786 580 790 592 802 598
      C820 614 812 640 796 656
      C774 686 720 704 660 712
      C650 740 650 790 660 820
      C740 830 800 860 840 920
      L880 1000 Z"/>

    <!-- the hand: index and middle fingers to the temple, the rest a fist, wrist to the bottom -->
    <path id="finger1" d="M612 336 C610 310 644 306 648 332 L672 560 L640 564 Z"/>
    <path id="finger2" d="M654 356 C652 330 686 326 690 352 L708 562 L676 566 Z"/>
    <path id="fist" d="M630 560 C636 536 690 532 724 552 C760 574 758 630 734 654 C700 680 640 674 626 640 C616 616 622 586 630 560 Z"/>
    <path id="thumb" d="M628 590 C598 588 584 614 592 644 C600 666 630 672 644 656 Z"/>
    <path id="wrist" d="M548 1000 L604 706 C612 668 646 652 684 656 C720 662 734 692 726 728 L664 1000 Z"/>
  </defs>

  <rect width="2200" height="1000" fill="#fff"/>

  <!-- ===== the telepath ===== -->
  <g id="man">
    <use href="#bust" fill="#000"/>

    <!-- ear: a white C inside the silhouette -->
    <path d="M568 392 C536 386 526 428 542 464 C552 486 578 488 588 470" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M562 420 C548 434 552 460 566 468" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

    <!-- hairline, swept back, and the sideburn -->
    <path d="M742 258 C700 278 650 272 604 252" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

    <!-- eye: lids in white, green iris -->
    <path d="M690 384 C712 368 740 370 756 388 C742 406 712 408 690 384 Z" fill="#fff"/>
    <circle cx="726" cy="388" r="13" fill="#36e836" filter="url(#glow)"/>
    <circle cx="729" cy="388" r="5" fill="#000"/>
    <!-- brow -->
    <path d="M688 350 C716 340 740 346 754 358" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <!-- mouth and jaw lines -->
    <path d="M740 568 C762 560 782 566 794 572" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <!-- collar -->
    <path d="M470 680 C520 750 600 760 660 712" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>

    <!-- hand, each part with a white gap under it -->
    <g fill="none" stroke="#fff" stroke-width="18" stroke-linejoin="round">
      <use href="#wrist"/><use href="#fist"/><use href="#thumb"/><use href="#finger2"/><use href="#finger1"/>
    </g>
    <g fill="#000">
      <use href="#wrist"/><use href="#fist"/><use href="#thumb"/><use href="#finger2"/><use href="#finger1"/>
    </g>
    <!-- finger creases and knuckles -->
    <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
      <path d="M624 420 L652 416 M634 490 L662 486 M666 436 L692 432 M676 500 L702 496"/>
      <path d="M646 562 L716 558"/>
      <path d="M662 592 C690 598 716 604 736 616"/>
    </g>
  </g>

  <!-- ===== the waves, from the temple to the screen ===== -->
  <g id="waves" filter="url(#glow)">
    <path d="M826 232 A230 230 0 0 1 826 448" fill="none" stroke="#36e836" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
    <path d="M916 200 A330 330 0 0 1 916 480" fill="none" stroke="#36e836" stroke-width="8.4" stroke-linecap="round" opacity="0.86"/>
    <path d="M1006 170 A430 430 0 0 1 1006 510" fill="none" stroke="#36e836" stroke-width="7.8" stroke-linecap="round" opacity="0.77"/>
    <path d="M1096 144 A530 530 0 0 1 1096 536" fill="none" stroke="#36e836" stroke-width="7.2" stroke-linecap="round" opacity="0.68"/>
    <path d="M1186 120 A630 630 0 0 1 1186 560" fill="none" stroke="#36e836" stroke-width="6.6" stroke-linecap="round" opacity="0.59"/>
    <path d="M1276 100 A730 730 0 0 1 1276 580" fill="none" stroke="#36e836" stroke-width="6.0" stroke-linecap="round" opacity="0.50"/>
  </g>

  <!-- ===== the computer ===== -->
  <g id="computer" transform="translate(1400 120)">
    <g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M-60 800 L120 800 M-20 816 L60 816 M520 800 L700 800 M580 816 L660 816"/>
      <path d="M-40 790 L40 790 M560 790 L680 790"/>
    </g>
    <path d="M40 740 L600 740 L640 790 L0 790 Z" fill="#fff" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    <path d="M90 700 L550 700 L560 740 L80 740 Z" fill="#fff" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    <rect x="20" y="40" width="600" height="660" rx="34" fill="#fff" stroke="#000" stroke-width="14"/>
    <rect x="48" y="66" width="544" height="606" rx="24" fill="none" stroke="#000" stroke-width="7"/>
    <path d="M90 110 L550 110 Q560 110 560 120 L560 400 Q560 410 550 410 L90 410 Q80 410 80 400 L80 120 Q80 110 90 110 Z" fill="#fff" stroke="#000" stroke-width="10"/>
    <path d="M118 140 Q320 128 522 140 Q534 142 536 156 Q546 270 536 380 Q534 394 522 396 Q320 408 118 396 Q106 394 104 380 Q94 270 104 156 Q106 142 118 140 Z" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="320" cy="268" rx="190" ry="92" fill="url(#screenglow)"/>
    <text x="320" y="290" text-anchor="middle" font-family="'Courier New', Courier, 'DejaVu Sans Mono', monospace" font-weight="bold" font-size="76" fill="#36e836" filter="url(#glow)">telepatch</text>
    <rect x="190" y="520" width="280" height="30" rx="8" fill="#fff" stroke="#000" stroke-width="8"/>
    <rect x="200" y="530" width="196" height="10" fill="#000"/>
    <rect x="400" y="512" width="80" height="46" rx="6" fill="none" stroke="#000" stroke-width="7"/>
    <circle cx="110" cy="536" r="9" fill="none" stroke="#000" stroke-width="7"/>
    <rect x="520" y="590" width="44" height="54" rx="6" fill="none" stroke="#000" stroke-width="7"/>
    <rect x="530" y="604" width="24" height="30" rx="3" fill="none" stroke="#000" stroke-width="7"/>
  </g>
</svg>
