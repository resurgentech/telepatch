[package]
name = "web"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The latest 0.8 pre-release; pinned exactly because alphas break each other.
dioxus = { version = "=0.8.0-alpha.3", features = ["web", "router"] }
futures-channel = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType", "CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement",
    "HtmlElement", "Location", "MessageEvent", "Navigator", "Response", "TextMetrics",
    "WebSocket", "Window", "console",
] }
